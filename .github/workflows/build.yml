name: build-release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      - name: Build xxdisasm32
        shell: pwsh
        run: |
          msbuild xxdisasm32/xxdisasm32/xxdisasm32.vcxproj `
            /p:Configuration=Release /p:Platform=Win32 `
            /p:PlatformToolset=v143 /p:WindowsTargetPlatformVersion=10.0 `
            /p:IncludePath="$env:INCLUDE;$env:GITHUB_WORKSPACE\pluginsdk" `
            /p:LibraryPath="$env:LIB;$env:GITHUB_WORKSPACE\pluginsdk" `
            /p:OutDir="$env:GITHUB_WORKSPACE\dist\" /t:Build /v:minimal

      - name: Build xx_comm32
        shell: pwsh
        run: |
          msbuild xx_comm32/xx_comm32/xx_comm32.vcxproj `
            /p:Configuration=Release /p:Platform=Win32 `
            /p:PlatformToolset=v143 /p:WindowsTargetPlatformVersion=10.0 `
            /p:IncludePath="$env:INCLUDE;$env:GITHUB_WORKSPACE\pluginsdk" `
            /p:LibraryPath="$env:LIB;$env:GITHUB_WORKSPACE\pluginsdk" `
            /p:OutDir="$env:GITHUB_WORKSPACE\dist\" /t:Build /v:minimal

      - name: Build xx_vm_x32 (main plugin)
        shell: pwsh
        run: |
          msbuild xx_vm_x32/xx_vm_x32/xx_vm_x32.vcxproj `
            /p:Configuration=Release /p:Platform=Win32 `
            /p:PlatformToolset=v143 /p:WindowsTargetPlatformVersion=10.0 `
            /p:IncludePath="$env:INCLUDE;$env:GITHUB_WORKSPACE\pluginsdk;$env:GITHUB_WORKSPACE\unicorn\include" `
            /p:LibraryPath="$env:LIB;$env:GITHUB_WORKSPACE\dist;$env:GITHUB_WORKSPACE\unicorn\lib;$env:GITHUB_WORKSPACE\libs;$env:GITHUB_WORKSPACE\pluginsdk" `
            /p:OutDir="$env:GITHUB_WORKSPACE\dist\" /t:Build /v:minimal

      - name: List artifacts
        shell: pwsh
        run: Get-ChildItem dist | Select-Object Name, Length

      - name: Continuous Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: continuous
          name: xxvm continuous build
          body: "xxvm plugin (VMP 3.8/3.9 restore) - continuous build from main"
          files: |
            dist/xx_vm_x32.dp32
            dist/xx_comm32.dll
            dist/xxdisasm32.dll
